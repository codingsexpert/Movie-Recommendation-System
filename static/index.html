<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieGraph AI — Intelligent Cinema Discovery & Recommendation Platform</title>
  <meta name="description" content="AI-powered movie recommendation engine using Knowledge Graphs, Vector Search, and Large Language Models to deliver Netflix-quality cinematic discovery.">

  <!-- Google Fonts: Poppins & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Marked parser for rendering markdown answers -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Vis.js for 2D Interactive Neo4j Subgraph Canvas -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <!-- Favicon: Clapperboard SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='2' width='20' height='20' rx='2.18' ry='2.18'></rect><path d='M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5'></path></svg>">
</head>
<body>

  <!-- ═══════════ Left Sidebar Navigation (Hotstar Style) ═══════════ -->
  <aside class="hotstar-sidebar">
    <div class="sidebar-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
        <line x1="7" y1="2" x2="7" y2="22"></line>
        <line x1="17" y1="2" x2="17" y2="22"></line>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="2" y1="7" x2="7" y2="7"></line>
        <line x1="2" y1="17" x2="7" y2="17"></line>
        <line x1="17" y1="17" x2="22" y2="17"></line>
        <line x1="17" y1="7" x2="22" y2="7"></line>
      </svg>
    </div>
    <nav class="sidebar-nav">
      <!-- Search -->
      <div class="sidebar-item" id="navSearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span class="sidebar-text">Search</span>
      </div>
      <!-- Home -->
      <div class="sidebar-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span class="sidebar-text">Home</span>
      </div>
      <!-- TV -->
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
        <span class="sidebar-text">TV</span>
      </div>
      <!-- Movies -->
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"></path></svg>
        <span class="sidebar-text">Movies</span>
      </div>
    </nav>
  </aside>

  <!-- ═══════════ Main Content Area ═══════════ -->
  <main class="hotstar-main">
    
    <!-- Unified AI Search Overlay (Hidden by default, shown when Search is clicked) -->
    <div id="searchOverlay" class="search-overlay hidden">
      <div class="search-container">
        <form id="searchForm" class="hotstar-search-box">
          <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="queryInput" placeholder="Ask AI: 'Recommend some great sci-fi movies like Inception'" autocomplete="off" />
          <button type="submit" id="searchBtn" class="hs-submit-btn">Search</button>
        </form>
        
        <!-- Loading State for AI Search -->
        <div id="loadingIndicator" class="loading-box hidden">
          <div class="spinner"></div>
          <p>AI is thinking...</p>
        </div>

        <!-- AI Search Results Row (Movie Cards) -->
        <div id="aiSearchResults" class="movie-row-container hidden">
          <h3 class="row-title" id="aiSearchTitle">AI Recommendations</h3>
          <div class="movie-row" id="aiSearchGrid"></div>
        </div>
      </div>
    </div>

    <!-- ═══════════ Hero Carousel ═══════════ -->
    <section class="hotstar-hero-carousel" id="heroCarousel">
      <!-- Injected by JS -->
    </section>

    <!-- ═══════════ Catalog Rows ═══════════ -->
    <section class="hotstar-catalog" id="catalogSection">
      <!-- Action Movies -->
      <div class="movie-row-container">
        <h3 class="row-title">Action Thrillers</h3>
        <div class="movie-row" id="rowAction"></div>
      </div>
      <!-- Sci-Fi Hits -->
      <div class="movie-row-container">
        <h3 class="row-title">Sci-Fi Masterpieces</h3>
        <div class="movie-row" id="rowSciFi"></div>
      </div>
      <!-- Critically Acclaimed -->
      <div class="movie-row-container">
        <h3 class="row-title">Critically Acclaimed Dramas</h3>
        <div class="movie-row" id="rowDrama"></div>
      </div>
      <!-- All Movies Fallback -->
      <div class="movie-row-container">
        <h3 class="row-title">Explore All</h3>
        <div class="movie-row" id="rowAll"></div>
      </div>
    </section>

  </main>

  <!-- ═══════════ Video Trailer Modal Overlay ═══════════ -->
  <div id="trailerModal" class="trailer-modal hidden">
    <div class="trailer-modal-backdrop" id="trailerBackdrop"></div>
    <div class="trailer-modal-content">
      <button class="trailer-close-btn" id="closeTrailerBtn">&times;</button>
      <div class="video-container">
        <iframe id="trailerIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
